<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CB Wheel</title>
<style>
  :root{ --accent:#4fd6ff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:#fff; overflow:hidden; touch-action:none;
    background:linear-gradient(160deg,#0f2027 0%,#203a43 48%,#2c5364 100%);
  }
  #stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 90% at 50% 12%,rgba(255,255,255,.10),rgba(255,255,255,0) 42%); }

  #title{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 22px); left:0; right:0; text-align:center;
    font-weight:700; letter-spacing:.14em; font-size:13px; text-transform:uppercase;
    color:rgba(255,255,255,.62); pointer-events:none; }
  #hint{ position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); left:0; right:0; text-align:center;
    font-size:12px; letter-spacing:.05em; color:rgba(255,255,255,.42); pointer-events:none;
    transition:opacity .5s ease; }

  #wheel{ position:relative; width:1px; height:1px; }

  .node{
    position:absolute; left:50%; top:50%;
    width:var(--nz,150px); height:var(--nz,150px); border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    padding:6px; text-align:center; cursor:pointer; user-select:none; will-change:transform;
    border:1px solid rgba(255,255,255,.42);
    background:radial-gradient(135% 135% at 30% 22%,rgba(255,255,255,.38),rgba(255,255,255,.10) 44%,rgba(255,255,255,.03) 70%);
    box-shadow:0 12px 34px rgba(0,0,0,.42), inset 0 2px 3px rgba(255,255,255,.65), inset 0 -14px 26px rgba(255,255,255,.05);
    -webkit-backdrop-filter:blur(13px) saturate(1.55); backdrop-filter:blur(13px) saturate(1.55);
    transition:border-color .25s ease, box-shadow .25s ease;
  }
  .node .glyph{ font-size:24px; line-height:1; margin-bottom:2px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
  .node .t{ font-weight:800; font-size:16px; letter-spacing:.02em; text-shadow:0 1px 3px rgba(0,0,0,.55); }
  .node.top{
    border-color:rgba(79,214,255,.85);
    box-shadow:0 14px 34px rgba(0,0,0,.45), 0 0 26px 3px rgba(79,214,255,.5),
               inset 0 2px 4px rgba(255,255,255,.75), inset 0 -12px 22px rgba(79,214,255,.10);
  }

  /* the enlarged fixed disc in the middle — its TEXT changes as you spin (buttons don't resize) */
  #center{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:var(--cz,220px); height:var(--cz,220px); border-radius:50%; z-index:200;
    display:flex; align-items:center; justify-content:center; text-align:center; cursor:pointer;
    border:1px solid rgba(79,214,255,.8);
    background:radial-gradient(135% 135% at 30% 20%,rgba(255,255,255,.42),rgba(255,255,255,.12) 44%,rgba(79,214,255,.10) 72%);
    box-shadow:0 22px 54px rgba(0,0,0,.5), 0 0 40px 6px rgba(79,214,255,.4),
               inset 0 3px 5px rgba(255,255,255,.8), inset 0 -16px 30px rgba(79,214,255,.12);
    -webkit-backdrop-filter:blur(16px) saturate(1.6); backdrop-filter:blur(16px) saturate(1.6);
  }
  #center .cinner{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px; }
  #center .glyph{ font-size:42px; line-height:1; filter:drop-shadow(0 2px 5px rgba(0,0,0,.4)); }
  #center .t{ font-weight:800; font-size:24px; letter-spacing:.02em; text-shadow:0 2px 4px rgba(0,0,0,.5); }
  #center .s{ font-weight:600; font-size:12px; letter-spacing:.07em; opacity:.85; text-transform:uppercase; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  @keyframes pop{ from{ transform:scale(.82); opacity:.15; } to{ transform:scale(1); opacity:1; } }

  /* placeholder modal (for buttons without a link yet) */
  #modal{ position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(6,14,20,.55); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  #modal.on{ display:flex; }
  #modal .card{ width:min(420px,86vw); border-radius:22px; padding:26px 24px 22px; text-align:center;
    border:1px solid rgba(255,255,255,.34);
    background:radial-gradient(130% 130% at 30% 12%,rgba(255,255,255,.20),rgba(255,255,255,.05) 55%,rgba(20,32,42,.35));
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 2px 3px rgba(255,255,255,.4);
    -webkit-backdrop-filter:blur(20px) saturate(1.5); backdrop-filter:blur(20px) saturate(1.5); }
  #modal .glyphBig{ font-size:44px; margin-bottom:6px; }
  #modal h2{ margin:0 0 4px; font-size:22px; letter-spacing:.02em; }
  #modal .sub{ margin:0 0 18px; color:rgba(255,255,255,.65); font-size:13px; letter-spacing:.05em; text-transform:uppercase; }
  #modal p{ margin:0 0 22px; color:rgba(255,255,255,.78); font-size:14px; }
  #modal button{ border:1px solid rgba(255,255,255,.4); border-radius:14px; padding:11px 26px; font-weight:700; font-size:14px;
    color:#fff; cursor:pointer;
    background:radial-gradient(130% 130% at 30% 22%,rgba(79,214,255,.42),rgba(79,214,255,.12) 60%);
    box-shadow:0 8px 22px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.5); }
  #modal button:active{ transform:translateY(1px); }
</style>
</head>
<body>
  <div id="title">Circuit Breaker Reference</div>
  <div id="stage"><div id="wheel"><div id="center"><div class="cinner" id="cinner"></div></div></div></div>
  <div id="hint">Drag to spin • the middle button is selected — tap it to open</div>

  <div id="modal"><div class="card">
    <div class="glyphBig" id="mGlyph">✈</div>
    <h2 id="mTitle">Title</h2>
    <div class="sub" id="mSub">Subtitle</div>
    <p>Reference content coming soon.</p>
    <button id="mClose">Close</button>
  </div></div>

<script>
(function(){
  const TAU = Math.PI*2, TOP = -Math.PI/2;                 // top slot at -90°
  const ITEMS = [
    { t:'B717', s:'Circuit Breakers', g:'✈', url:'https://willdeluna.github.io/717CB/' },
    { t:'B737', s:'Circuit Breakers', g:'✈', url:'https://willdeluna.github.io/737CB/' },
    { t:'A220', s:'Circuit Breakers', g:'🛩', url:'https://willdeluna.github.io/220CB/' },
    { t:'A320', s:'Circuit Breakers', g:'🛩', url:'https://willdeluna.github.io/320CB/' },
    { t:'Common', s:'Resets', g:'↻', url:'https://willdeluna.github.io/CommonResets/' },
    { t:'Useful', s:'Refs', g:'📘', url:'https://willdeluna.github.io/UsefulRefs/' },
    { t:'ATA', s:'Finder', g:'🔎', url:'https://willdeluna.github.io/ATA/' },
    { t:'Locations', s:'', g:'📍', url:'https://willdeluna.github.io/3Dviewer/' },
  ];
  const N = ITEMS.length, STEP = TAU/N;                    // evenly space however many buttons there are

  const wheel = document.getElementById('wheel');
  const hint  = document.getElementById('hint');
  const nodes = ITEMS.map((it,i)=>{
    const el = document.createElement('div');
    el.className = 'node';
    el.innerHTML = '<div class="glyph">'+it.g+'</div><div class="t">'+it.t+'</div>';
    el.addEventListener('click', ()=>{ if(dragged) return; onPick(i); });
    wheel.appendChild(el);
    return el;
  });

  let R = 200, NZ = 150;              // radius + node size (px), set by resize()
  function resize(){
    const vmin = Math.min(window.innerWidth, window.innerHeight);
    NZ = Math.max(92, Math.min(150, vmin*0.20));
    R  = Math.max(132, Math.min(250, vmin*0.33));
    document.documentElement.style.setProperty('--nz', NZ+'px');
    document.documentElement.style.setProperty('--cz', (NZ*1.55)+'px');
  }

  let rot = 0, vel = 0;               // wheel angle + angular velocity (radians)
  let dragging = false, dragged = false, target = null;
  let lastA = 0, rotAtDown = 0;

  function topIndex(){ return ((Math.round(-rot/STEP) % N) + N) % N; }
  function snap(r){ return Math.round(r/STEP)*STEP; }

  const cinner = document.getElementById('cinner');
  let curCenter = -1;
  function setCenter(i){
    if(i === curCenter) return;
    curCenter = i;
    const it = ITEMS[i];
    cinner.innerHTML = '<div class="glyph">'+it.g+'</div><div class="t">'+it.t+'</div>'+(it.s?'<div class="s">'+it.s+'</div>':'');
    cinner.style.animation = 'none'; void cinner.offsetWidth; cinner.style.animation = 'pop .28s ease';   // re-trigger the text swap animation
  }

  function layout(){
    const ti = topIndex();
    for(let i=0;i<N;i++){                                          // ring stays uniform + evenly spaced → symmetrical
      const a = TOP + i*STEP + rot;
      const x = Math.cos(a)*R, y = Math.sin(a)*R;
      const n = nodes[i];
      n.style.transform = 'translate(-50%,-50%) translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';
      n.classList.toggle('top', i===ti);
    }
    setCenter(ti);                                                 // the middle disc shows the selected button — only its TEXT changes
  }

  function frame(){
    if(!dragging){
      if(Math.abs(vel) > 0.0006){
        rot += vel; vel *= 0.94;
        if(Math.abs(vel) <= 0.0006){ vel = 0; target = snap(rot); }
      } else if(target !== null){
        rot += (target - rot) * 0.18;
        if(Math.abs(target - rot) < 0.0008){ rot = target; target = null; }
      }
    }
    layout();
    requestAnimationFrame(frame);
  }

  // ---- pointer / drag (grab anywhere) ----
  function angleAt(e){
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    return Math.atan2(e.clientY - cy, e.clientX - cx);
  }
  function down(e){
    dragging = true; dragged = false; vel = 0; target = null;
    lastA = angleAt(e); rotAtDown = rot;
    hint.style.opacity = '0';
  }
  function move(e){
    if(!dragging) return;
    const a = angleAt(e);
    let d = a - lastA;
    if(d >  Math.PI) d -= TAU;
    if(d < -Math.PI) d += TAU;
    rot += d; vel = d; lastA = a;
    if(Math.abs(rot - rotAtDown) > 0.05) dragged = true;
    e.preventDefault();
  }
  function up(){
    if(!dragging) return;
    dragging = false;
    if(!dragged){ target = snap(rot); }        // a tap → settle to nearest slot (click handlers do the pick)
  }

  const stage = document.getElementById('stage');
  stage.addEventListener('pointerdown', e=>{ down(e); });
  window.addEventListener('pointermove', move, {passive:false});
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);

  // ---- selecting a button ----
  function onPick(i){
    if(i === topIndex()){ openModal(i); return; }
    let tr = -i*STEP;                          // rot that brings node i to the top/centre
    while(tr - rot >  Math.PI) tr -= TAU;
    while(tr - rot < -Math.PI) tr += TAU;
    vel = 0; target = tr;
  }

  // ---- open: linked buttons navigate, others show placeholder ----
  const modal = document.getElementById('modal');
  function openModal(i){
    const it = ITEMS[i];
    if(it.url){ window.location.href = it.url; return; }   // linked buttons navigate to their page
    document.getElementById('mGlyph').textContent = it.g;
    document.getElementById('mTitle').textContent = it.t;
    document.getElementById('mSub').textContent = it.s;
    modal.classList.add('on');
  }
  document.getElementById('center').addEventListener('click', ()=>{ if(dragged) return; openModal(topIndex()); });
  document.getElementById('mClose').addEventListener('click', ()=> modal.classList.remove('on'));
  modal.addEventListener('click', e=>{ if(e.target===modal) modal.classList.remove('on'); });

  window.addEventListener('resize', resize);
  resize(); layout(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
